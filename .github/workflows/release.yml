name: Release plugin artifacts

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      # All third-party actions are SHA-pinned per supply-chain best practice:
      # tag references can be repointed (or hijacked via npm-style typosquats),
      # commit SHAs cannot. Comments record the human-readable version next to
      # each SHA so dependabot/renovate-style bumps stay reviewable.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'

      - run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build plugin JSONs
        run: |
          node build.js
          node build.js --marketplace

      - name: Build webview bundle
        run: npx webpack

      - name: SHA256 checksums
        run: |
          sha256sum \
            facevault-kyc.json \
            facevault-kyc.marketplace.json \
            dist/facevault-kyc-view.js \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: |
            facevault-kyc.json
            facevault-kyc.marketplace.json
            dist/facevault-kyc-view.js
            SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
